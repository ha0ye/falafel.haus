name: Deploy blogdown site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-renv@v2

      - name: Read Hugo version
        id: hugo-version
        run: |
          v=$(grep -oP "^\s*HUGO_VERSION\s*=\s*[\"']\K[^\"']+" netlify.toml)
          test -n "$v" || { echo "No HUGO_VERSION in netlify.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo-version.outputs.version }}
          extended: true

      - name: Debug hugo install
        run: |
          which hugo || echo "hugo not found"
          ls -a
          Rscript -e 'print(blogdown:::site_root()); print(blogdown::find_hugo())'

      - name: Build site
        run: |
          Rscript -e 'options(error = function() { traceback(3); quit(status = 1) }); blogdown::build_site(build_rmd = TRUE)'

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
